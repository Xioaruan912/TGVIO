name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.lock -r requirements.player.lock
      - run: python scripts/repository_hygiene.py
      - run: python scripts/release_guard.py architecture .
      - run: PYTHONPATH=src python -m unittest discover -s tests
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The front end lives in TGVIO-Player; check the exact commit in player-web.lock.
      - run: git clone --quiet "$(sed -n 's/^repository=//p' player-web.lock)" "$RUNNER_TEMP/TGVIO-Player"
      - run: bash scripts/player_web_source.sh --git "$RUNNER_TEMP/TGVIO-Player" --dest "$RUNNER_TEMP/player-web"
      - run: npm --prefix "$RUNNER_TEMP/player-web" ci
      - run: npm --prefix "$RUNNER_TEMP/player-web" run check
