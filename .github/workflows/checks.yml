name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements.lock
      - run: python scripts/repository_hygiene.py
      - run: python scripts/release_guard.py architecture .
      - run: PYTHONPATH=src python -m unittest discover -s tests
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix console ci
      - run: npm --prefix console run check
