<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local library layout fixture</title></head><body><output id="regression-result" hidden></output><script type="module">
import "/src/style.css";
import { VideoLibraryPage } from "/src/library.ts";
const result=document.querySelector("#regression-result");
const assert=(ok,message)=>{if(!ok)throw new Error(message);};
const wait=async predicate=>{for(let n=0;n<150;n++){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,20));}throw new Error("Timed out waiting for "+String(predicate).slice(0,90));};
const visible=el=>{const s=getComputedStyle(el);return s.display!=="none"&&s.visibility!=="hidden"&&el.getClientRects().length>0;};
try {
 const status=await (await fetch("/__acceptance__/status")).json();
 assert(status.localOnly&&status.libraryOriginals===900,"Must use local 900-original fixture");
 let played=[];
 const page=new VideoLibraryPage(clips=>played.push(clips),()=>{}, {mediaId:status.testClipId});
 document.body.append(page.root);
 await wait(()=>page.root.querySelectorAll(".cover-tile").length===20);
 assert(page.root.querySelectorAll("video").length===0,"Metadata must not create videos");
 assert(page.root.querySelectorAll("button button").length===0,"A card control must never nest inside another button");
 for(const node of page.root.querySelectorAll(".library-button,.cover-tile-preview,.cover-tile-select:not([hidden])")) {
  if(!visible(node))continue;
  const rect=node.getBoundingClientRect();assert(rect.width>=43.9&&rect.height>=43.9,"Control smaller than 44px: "+node.className);
 }
 // Real cover states: one server cover loads, one broken cover degrades, the rest are explicit placeholders.
 await wait(()=>page.root.querySelector('.cover-tile[data-cover-state="ready"]'));
 const ready=page.root.querySelector('.cover-tile[data-cover-state="ready"]');
 const image=ready.querySelector("img.cover-tile-image");
 assert(image&&image.complete&&image.naturalWidth>0,"A ready cover must show a decoded image");
 assert(image.loading==="lazy","Covers must load lazily");
 assert(image.getAttribute("alt")==="","A decorative cover must not carry alt text");
 await wait(()=>page.root.querySelector('.cover-tile[data-cover-state="failed"]'));
 const failed=page.root.querySelector('.cover-tile[data-cover-state="failed"]');
 assert(failed.textContent.includes("封面加载失败"),"A broken cover must say so");
 assert(visible(failed.querySelector(".cover-tile-retry")),"A broken cover must offer a retry");
 const missing=[...page.root.querySelectorAll('.cover-tile[data-cover-state="missing"]')].find(tile=>!tile.querySelector("img"));
 assert(missing&&missing.textContent.includes("暂无封面"),"A tile without a cover must be an explicit placeholder");
 const list=page.root.querySelector(".library-list");
 const bounds=list.getBoundingClientRect();assert(bounds.height>=68,"No visible tile in landscape");
 for(const tile of page.root.querySelectorAll(".cover-tile")) {
  const rect=tile.getBoundingClientRect();assert(rect.right<=innerWidth+1&&rect.left>=-1,"Tile overflows viewport");
 }
 assert(page.root.scrollWidth<=page.root.clientWidth+1,"Horizontal overflow");
 const gridStyle=getComputedStyle(list);
 assert(gridStyle.display==="grid","the video list must render as a cover grid");
 const gridColumns=gridStyle.gridTemplateColumns.split(" ").filter(Boolean).length;
 if(innerWidth<600)assert(gridColumns===2,"phone grid must show two readable cover columns, got "+gridColumns);
 else assert(gridColumns>=3,"wide grid must show at least three cover columns, got "+gridColumns);
 const tile=page.root.querySelector(".cover-tile").getBoundingClientRect();
 assert(tile.height>tile.width,"a portrait cover tile must be taller than it is wide");
 assert(tile.width>=110,"a cover tile must be wide enough to read, got "+Math.round(tile.width));
 const duration=page.root.querySelector(".cover-tile-duration");
 assert(Boolean(duration),"every tile states its duration or that it is unknown");
 // Multi-select is a mode: browsing taps play, select mode taps select.
 assert(page.root.querySelector(".library-selection").hidden,"the selection bar is hidden while browsing");
 assert([...page.root.querySelectorAll(".cover-tile-select")].every(node=>!visible(node)),"browsing shows no check controls");
 const firstCover=page.root.querySelector(".cover-tile-play");
 firstCover.click();
 assert(played.length===1&&played[0].length===1,"tapping a cover plays exactly that clip");
 const toggle=[...page.root.querySelectorAll(".library-button")].find(button=>button.textContent==="选择");
 toggle.click();
 await wait(()=>visible(page.root.querySelector(".cover-tile-select")));
 assert(!page.root.querySelector(".library-selection").hidden,"select mode exposes the selection bar");
 const compared=played.length;
 page.root.querySelectorAll(".cover-tile-play")[0].click();
 assert(played.length===compared,"select mode must not start playback");
 assert(page.root.querySelector(".cover-tile-select").getAttribute("aria-checked")==="true","the cover toggles selection state");
 page.root.querySelectorAll(".cover-tile-select")[2].click();
 assert(page.root.textContent.includes("播放选中 (2/100)"),"the bar shows the real selected count");
 list.scrollTop=100; const scroll=list.scrollTop;
 const selectedIds=[...page.root.querySelectorAll(".cover-tile.is-selected")].map(node=>node.querySelector(".cover-tile-play").getAttribute("aria-label"));
 assert(selectedIds.length===2,"selected covers are marked with a check state");
 page.root.querySelector(".library-selection button").click();
 assert(played.at(-1).length===2,"Selection playback only");
 page.setPlaybackActive(true);assert(page.root.inert,"Page inert while player active");
 page.setPlaybackActive(false);assert(!page.root.inert&&list.scrollTop===scroll,"Playback return must preserve scroll");
 assert(document.activeElement===page.root.querySelector(".library-selection button"),"Playback return must restore the launch control");
 const before=page.root.querySelectorAll(".cover-tile").length;
 page.removeMedia(played.at(-1)[0].id);
 assert(page.root.querySelectorAll(".cover-tile").length===before-1,"Remove tile");
 assert(list.scrollTop===scroll,"Deletion resets scroll");
 assert([...page.root.querySelectorAll(".cover-tile-select")].filter(node=>node.getAttribute("aria-checked")==="true").length===1,"Deletion clears that selection");
 page.destroy();
 const dates=new VideoLibraryPage(()=>{},()=>{});document.body.append(dates.root);
 await wait(()=>dates.root.querySelector("input[type=date]"));
 const input=dates.root.querySelector("input[type=date]");assert(parseFloat(getComputedStyle(input).fontSize)>=16,"Native date input font <16px");
 input.value="2026-05-31";input.dispatchEvent(new Event("change"));
 await wait(()=>dates.root.querySelectorAll(".library-index-row").length===2);
 assert(!dates.root.textContent.includes("上传完成时间"),"Folders date must not be presented as upload timestamp");
 dates.destroy();
 // Favorites reuse the same cover unit; their scope label must state what is loaded.
 const { FavoritesPage } = await import("/src/favorites.ts");
 let favoritesPlayed = [];
 const favorites = new FavoritesPage(clips => favoritesPlayed.push(clips), () => {});
 document.body.append(favorites.root);
 await wait(()=>favorites.root.querySelectorAll(".cover-tile").length>=20);
 assert(favorites.root.querySelectorAll("video").length===0,"Favorites browsing must not create videos");
 const scoped = [...favorites.root.querySelectorAll(".library-button")].find(button=>button.textContent.startsWith("播放已加载"));
 assert(scoped&&scoped.textContent.includes("("+favorites.root.querySelectorAll(".cover-tile").length+")"),"the play-all label must state the loaded scope");
 assert([...favorites.root.querySelectorAll(".cover-tile-select")].every(node=>!visible(node)),"favorites browsing shows no check controls");
 for(const node of favorites.root.querySelectorAll(".library-button,.cover-tile-preview")) { if(!visible(node))continue; const rect=node.getBoundingClientRect(); assert(rect.width>=43.9&&rect.height>=43.9,"Favorites control smaller than 44px: "+node.className); }
 favorites.root.querySelector(".cover-tile-play").click();
 assert(favoritesPlayed.length===1&&favoritesPlayed[0].length===1,"tapping a favorite cover plays that clip");
 // Spend the three automatic follow-ups, then prove the manual entry is still
 // reachable inside the scrolling list, including low-height landscape.
 const favoriteList=favorites.root.querySelector(".library-list");
 for(let n=0;n<3;n++) {
  const before=favorites.root.querySelectorAll(".cover-tile").length;
  favoriteList.scrollTop=favoriteList.scrollHeight;
  favoriteList.dispatchEvent(new Event("scroll"));
  await wait(()=>favorites.root.querySelectorAll(".cover-tile").length>=before+20);
 }
 await wait(()=>[...favorites.root.querySelectorAll("button")].some(button=>button.textContent==="加载更多"));
 const more=[...favorites.root.querySelectorAll("button")].find(button=>button.textContent==="加载更多");
 more.scrollIntoView({block:"end"});
 const moreRect=more.getBoundingClientRect(),listRect=favoriteList.getBoundingClientRect();
 assert(moreRect.top>=listRect.top-1&&moreRect.bottom<=listRect.bottom+1,"manual favorites paging must be visible and reachable");
 assert(moreRect.height>=43.9&&moreRect.width>=43.9,"manual favorites paging must retain the 44px touch target");
 const beforeManual=favorites.root.querySelectorAll(".cover-tile").length;
 more.click();
 await wait(()=>favorites.root.querySelectorAll(".cover-tile").length===beforeManual+20);
 assert(scoped.textContent.includes("("+(beforeManual+20)+")"),"manual paging updates the loaded playback scope");
 assert(favorites.root.querySelectorAll("video").length===0,"even large favorite grids remain metadata-only");
 favorites.destroy();
 const after=await (await fetch("/__acceptance__/status")).json();
 assert(after.requests===status.requests,"Library metadata warmed media");
 assert(after.coverRequests>0,"the fixture cover was actually fetched by the browser");
 result.textContent=JSON.stringify({ok:true,width:innerWidth,height:innerHeight,metadataOnly:true,controls44:true,covers:after.coverRequests});
} catch(error) {
 const diag=[...document.querySelectorAll(".cover-tile")].slice(0,4).map(tile=>tile.dataset.coverState+"/"+(tile.querySelector("img")?.getAttribute("src")??"-")).join(",");
 result.textContent=JSON.stringify({ok:false,width:innerWidth,error:String(error.message)+" ["+diag+"]"});
}
</script></body></html>
