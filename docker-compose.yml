services:
  tgvio:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    container_name: tgvio
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /app/src
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./session:/app/session
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

