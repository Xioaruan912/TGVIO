services:
  bot:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    container_name: telegram-video-forwarder
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./session:/app/session
      - ./downloads:/app/downloads
