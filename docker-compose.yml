services:
  bot:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    container_name: telegram-video-forwarder
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8787}:8787"
    volumes:
      - ./session:/app/session
      - ./downloads:/app/downloads
