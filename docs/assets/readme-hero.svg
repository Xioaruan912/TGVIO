<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="TGVIO — 你的私人 Telegram 媒体收集与归档助手">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="76%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="22%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2230" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#141821" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseSoft {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes progressFill {
        0% { width: 54px; }
        55% { width: 176px; }
        85% { width: 176px; }
        100% { width: 54px; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-220px); opacity: 0; }
        25% { opacity: 0.7; }
        75% { opacity: 0.7; }
        100% { transform: translateX(360px); opacity: 0; }
      }
      @keyframes dotPing {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.35); opacity: 0.55; }
      }
      .float-window { animation: floatY 6.5s ease-in-out infinite; }
      .ambient-glow { animation: pulseSoft 5.5s ease-in-out infinite; }
      .prog-bar { animation: progressFill 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .shimmer-line { animation: shimmer 4.6s ease-in-out infinite; }
      .live-dot { transform-box: fill-box; transform-origin: center; animation: dotPing 2.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .float-window, .ambient-glow, .prog-bar, .shimmer-line, .live-dot { animation: none; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#glowBlue)" class="ambient-glow"/>
  <rect width="1200" height="440" rx="28" fill="url(#glowMint)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- Left Editorial Column -->
  <g transform="translate(68, 72)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="234" height="32" rx="16" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-opacity="0.35"/>
    <circle cx="18" cy="16" r="4.5" fill="#30D158" class="live-dot"/>
    <text x="32" y="20.5" class="font" font-size="13" font-weight="600" fill="#8CC8FF" letter-spacing="0.2">Telegram 私人收藏与网盘助手</text>

    <!-- Brand Headline -->
    <text x="0" y="96" class="font" font-size="58" font-weight="700" fill="#F5F7FA" letter-spacing="-1.6">TGVIO</text>

    <!-- Accent Shimmer Rule -->
    <rect x="0" y="114" width="132" height="4" rx="2" fill="url(#accentBar)"/>
    <clipPath id="barClip"><rect x="0" y="114" width="132" height="4" rx="2"/></clipPath>
    <g clip-path="url(#barClip)">
      <rect x="0" y="114" width="54" height="4" fill="#FFFFFF" fill-opacity="0.75" class="shimmer-line"/>
    </g>

    <!-- Plain-language Subtitle -->
    <text x="0" y="160" class="font" font-size="22" font-weight="600" fill="#E5E9F0">转发或勾选，自动整理进频道与网盘。</text>
    <text x="0" y="194" class="font" font-size="15.5" fill="#98A2B3">告别繁琐下载与手动上传。手机发给机器人、电脑网页批量挑，</text>
    <text x="0" y="218" class="font" font-size="15.5" fill="#98A2B3">自动备份到你的私人网盘，传完即清缓存，全程防窥保护隐私。</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="59" y="21.5" text-anchor="middle" class="font" font-size="13" font-weight="500" fill="#E2E8F0">网页批量挑选</text>

      <rect x="128" y="0" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="187" y="21.5" text-anchor="middle" class="font" font-size="13" font-weight="500" fill="#E2E8F0">全局防窥遮屏</text>

      <rect x="256" y="0" width="128" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="320" y="21.5" text-anchor="middle" class="font" font-size="13" font-weight="500" fill="#E2E8F0">网盘自动重试</text>

      <rect x="394" y="0" width="120" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="454" y="21.5" text-anchor="middle" class="font" font-size="13" font-weight="500" fill="#E2E8F0">传完自动清盘</text>
    </g>
  </g>

  <!-- Right Floating macOS Console Preview -->
  <g transform="translate(656, 54)">
    <g class="float-window" filter="url(#softShadow)">
    <rect x="0" y="0" width="484" height="332" rx="20" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>

    <!-- Window Top Bar -->
    <rect x="0" y="0" width="484" height="42" rx="20" fill="#FFFFFF" fill-opacity="0.03"/>
    <line x1="0" y1="42" x2="484" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="22" cy="21" r="5.5" fill="#FF5F57"/>
    <circle cx="40" cy="21" r="5.5" fill="#FEBC2E"/>
    <circle cx="58" cy="21" r="5.5" fill="#28C840"/>
    <text x="242" y="25" text-anchor="middle" class="font" font-size="12.5" font-weight="600" fill="#98A2B3">TGVIO 网页控制台</text>
    <!-- Privacy Shield Pill -->
    <rect x="386" y="10" width="82" height="22" rx="11" fill="#30D158" fill-opacity="0.16" stroke="#30D158" stroke-opacity="0.4"/>
    <text x="427" y="24.5" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#63E686">防窥已开启</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="124" height="290" fill="#0E121A" fill-opacity="0.55"/>
    <line x1="124" y1="42" x2="124" y2="332" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <rect x="12" y="58" width="100" height="30" rx="8" fill="#0A84FF" fill-opacity="0.22"/>
    <text x="24" y="77" class="font" font-size="12" font-weight="600" fill="#70B8FF">任务队列</text>
    <text x="24" y="111" class="font" font-size="12" fill="#8B95A5">挑选采集</text>
    <text x="24" y="141" class="font" font-size="12" fill="#8B95A5">频道来源</text>
    <text x="24" y="171" class="font" font-size="12" fill="#8B95A5">系统设置</text>

    <!-- Privacy Badge in Sidebar -->
    <rect x="12" y="284" width="100" height="32" rx="9" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="62" y="304" text-anchor="middle" class="font" font-size="11" fill="#98A2B3">严格禁播 · 仅管理</text>

    <!-- Main Content Area -->
    <g transform="translate(142, 58)">
      <!-- Active /begin Draft Card -->
      <rect x="0" y="0" width="324" height="84" rx="13" fill="#0A84FF" fill-opacity="0.1" stroke="#0A84FF" stroke-opacity="0.32"/>
      <rect x="12" y="12" width="96" height="22" rx="11" fill="#0A84FF" fill-opacity="0.24"/>
      <text x="60" y="26.5" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#8CC8FF">/begin 收集草稿</text>
      <text x="118" y="27" class="font" font-size="12" fill="#E2E8F0">3 个媒体 · 88 MB</text>
      <rect x="246" y="11" width="66" height="24" rx="12" fill="#0A84FF"/>
      <text x="279" y="26.5" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#FFFFFF">合并发布</text>
      <rect x="12" y="46" width="210" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
      <rect x="12" y="63" width="146" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.07"/>

      <!-- Active Job Card with Animated Progress -->
      <rect x="0" y="98" width="324" height="82" rx="13" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <circle cx="18" cy="118" r="4" fill="#0A84FF" class="live-dot"/>
      <text x="30" y="122" class="font" font-size="13" font-weight="600" fill="#F1F5F9">#108 正在备份到网盘</text>
      <rect x="252" y="107" width="58" height="20" rx="10" fill="#30D158" fill-opacity="0.16"/>
      <text x="281" y="120.5" text-anchor="middle" class="font" font-size="10.5" font-weight="600" fill="#63E686">自动重试</text>
      <text x="14" y="143" class="font" font-size="11.5" fill="#8B95A5">条目名称已防窥隐藏 · 4 视频 · 178 MB</text>
      <rect x="14" y="156" width="296" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.1"/>
      <rect x="14" y="156" width="120" height="7" rx="3.5" fill="url(#accentBar)" class="prog-bar"/>

      <!-- Completed Job Card -->
      <rect x="0" y="194" width="324" height="62" rx="13" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="18" cy="216" r="4" fill="#30D158"/>
      <text x="30" y="220" class="font" font-size="13" font-weight="600" fill="#CBD5E1">#107 已完成 · 缓存已清空</text>
      <text x="14" y="241" class="font" font-size="11.5" fill="#64748B">已入库 PPVIO 私人播放器 · 本地占用 0 MB</text>
    </g>
    </g>
  </g>
</svg>
